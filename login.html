<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — MYTRM Healthcare Portal</title>
  <meta name="description" content="Sign in to MYTRM as a Client, Doctor, or Administrator.">
  
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand-logo">
        MYTRM<span class="dot"></span>
      </a>

      <div class="nav-actions">
        <a href="signup.html" class="btn btn-secondary btn-sm">Create User Account</a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="auth-wrapper">
    <div class="auth-card" style="max-width: 480px;">
      
      <div class="auth-header">
        <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 0.75rem;">MYTRM<span class="dot"></span></a>
        <h1>Portal Login</h1>
        <p style="font-size: 0.95rem;">Select your portal role below to sign in.</p>
      </div>

      <!-- Registration Success Alert Banner -->
      <div id="registered-alert" style="display: none; background: var(--color-success-bg); color: var(--color-success); border: 1px solid #A5D6A7; padding: 0.75rem 1rem; border-radius: var(--radius-sm); font-size: 0.875rem; margin-bottom: 1.25rem; font-weight: 600; text-align: center;">
        ✓ Account registered successfully! Please log in below.
      </div>

      <!-- Role Tabs -->
      <div style="display: flex; gap: 0.5rem; background: var(--color-bg-page); padding: 0.35rem; border-radius: var(--radius-sm); border: 1px solid var(--color-border); margin-bottom: 1.75rem;">
        <button type="button" class="btn btn-sm role-tab active" data-role="USER" onclick="switchLoginRole('USER')" style="flex: 1;">Client Login</button>
        <button type="button" class="btn btn-sm role-tab" data-role="DOCTOR" onclick="switchLoginRole('DOCTOR')" style="flex: 1;">Doctor Login</button>
        <button type="button" class="btn btn-sm role-tab" data-role="ADMIN" onclick="switchLoginRole('ADMIN')" style="flex: 1;">Admin</button>
      </div>

      <!-- Login Form -->
      <form id="role-login-form" onsubmit="handleLoginSubmit(event)">
        
        <div class="form-group" id="field-identity">
          <label for="login-identifier" class="form-label" id="label-identifier">Email Address</label>
          <input type="text" id="login-identifier" class="form-control" placeholder="Enter your ID or email" value="" autocomplete="username" required />
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <label for="login-pass" class="form-label" style="margin: 0;">Password</label>
            <a href="forgot-password.html" style="font-size: 0.8rem; color: var(--color-primary); font-weight: 600;">Forgot?</a>
          </div>
          <input type="password" id="login-pass" class="form-control" placeholder="Enter your password" value="" autocomplete="current-password" required />
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-lg btn-full" style="margin-top: 0.5rem;">
          Sign In as Client &rarr;
        </button>
      </form>

      <div class="auth-footer" id="login-auth-footer">
        Don't have a user account yet? <a href="signup.html" style="color: var(--color-primary); font-weight: 700;">Sign up here</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/script.js"></script>
  <script>
    let activeRole = "USER";

    function switchLoginRole(role) {
      activeRole = role;
      document.querySelectorAll(".role-tab").forEach(tab => {
        const isMatch = tab.getAttribute("data-role") === role;
        tab.classList.toggle("active", isMatch);
        if (isMatch) {
          tab.classList.add("btn-primary");
          tab.classList.remove("btn-ghost");
        } else {
          tab.classList.remove("btn-primary");
          tab.classList.add("btn-ghost");
        }
      });

      const labelIdent = document.getElementById("label-identifier");
      const inputIdent = document.getElementById("login-identifier");
      const inputPass = document.getElementById("login-pass");
      const btnSubmit = document.getElementById("login-submit-btn");

      if (role === "USER") {
        labelIdent.innerText = "Email Address";
        inputIdent.placeholder = "Enter your ID or email";
        inputIdent.value = "";
        inputPass.value = "";
        btnSubmit.innerText = "Sign In as Client →";
      } else if (role === "DOCTOR") {
        labelIdent.innerText = "Doctor Email or Name";
        inputIdent.placeholder = "Enter your ID or email";
        inputIdent.value = "";
        inputPass.value = "";
        btnSubmit.innerText = "Sign In as Doctor →";
      } else if (role === "ADMIN") {
        labelIdent.innerText = "Admin Email";
        inputIdent.placeholder = "Enter your ID or email";
        inputIdent.value = "";
        inputPass.value = "";
        btnSubmit.innerText = "Sign In as Admin →";
      }
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const identifier = document.getElementById("login-identifier").value.trim();
      const password = document.getElementById("login-pass").value.trim();

      const btn = document.getElementById("login-submit-btn");
      btn.innerText = "Authenticating...";
      btn.disabled = true;

      let res = { success: false, error: "Invalid credentials" };

      if (activeRole === "USER") {
        res = await apiLoginUser(identifier, password);
      } else if (activeRole === "DOCTOR") {
        res = await apiLoginDoctor(identifier, password);
      } else if (activeRole === "ADMIN") {
        res = await apiLoginAdmin(identifier, password);
      }

      btn.disabled = false;

      if (res.success && res.user) {
        setSession(res.user);
        showToast(`Welcome back, ${res.user.name}!`);

        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get("redirect");

        setTimeout(() => {
          if (redirect) {
            window.location.href = redirect;
          } else if (res.user.role === "ADMIN") {
            window.location.href = "admin-dashboard.html";
          } else if (res.user.role === "DOCTOR") {
            window.location.href = "doctor-dashboard.html";
          } else {
            window.location.href = "dashboard.html";
          }
        }, 300);
      } else {
        showToast(res.error || "Login failed", "warning");
        btn.innerText = `Sign In as ${activeRole} →`;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const roleParam = (urlParams.get("role") || "").toUpperCase();
      const registered = urlParams.get("registered");

      if (registered) {
        document.getElementById("registered-alert").style.display = "block";
      }

      if (roleParam === "DOCTOR" || roleParam === "ADMIN") {
        switchLoginRole(roleParam);
      } else {
        switchLoginRole("USER");
      }
    });
  </script>
</body>
</html>
