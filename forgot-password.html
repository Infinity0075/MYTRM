<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — MYTRM</title>
  <meta name="description" content="Reset your MYTRM account password securely.">
  
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand-logo">
        MYTRM<span class="dot"></span>
      </a>

      <div class="nav-actions">
        <a href="login.html" class="btn btn-ghost">Back to Login</a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="auth-wrapper">
    <div class="auth-card" id="forgot-card">
      <div class="auth-header">
        <a href="index.html" class="brand-logo" aria-label="MYTRM Home"><img src="assets/doctors/ChatGPT Image Sep 27, 2026, 10_41_06 AM.png" alt="MYTRM Logo" class="brand-logo-img" /></a>
        <h1>Reset Password</h1>
        <p style="font-size: 0.95rem;">Enter your registered email address and we'll submit a reset request to our database.</p>
      </div>

      <form id="forgot-form" onsubmit="handleForgotSubmit(event)">
        <div class="form-group">
          <label for="reset-email" class="form-label">Email Address</label>
          <input type="email" id="reset-email" class="form-control" placeholder="you@example.com" required />
        </div>

        <button type="submit" id="reset-submit-btn" class="btn btn-primary btn-lg btn-full" style="margin-top: 0.5rem;">
          Send Reset Request &rarr;
        </button>
      </form>

      <div class="auth-footer">
        Remember your password? <a href="login.html" style="color: var(--color-primary); font-weight: 700;">Log in</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/script.js"></script>
  <script>
    async function handleForgotSubmit(e) {
      e.preventDefault();
      const email = document.getElementById("reset-email").value.trim();
      const btn = document.getElementById("reset-submit-btn");

      btn.innerText = "Submitting Request...";
      btn.disabled = true;

      const res = await apiRequestPasswordReset(email);

      btn.disabled = false;
      btn.innerText = "Send Reset Request →";

      const card = document.getElementById("forgot-card");
      card.innerHTML = `
        <div style="text-align: center; padding: 1.5rem 0;">
          <div style="width: 64px; height: 64px; background: var(--color-success-bg); color: var(--color-success); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 1.25rem auto;">✓</div>
          <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Request Submitted</h2>
          <p style="font-size: 0.95rem; color: var(--color-text-muted); margin-bottom: 1.5rem;">
            A password reset request for <strong>${email}</strong> has been logged to the database. Check your email or contact support for assistance.
          </p>
          <a href="login.html" class="btn btn-primary btn-full">Return to Login</a>
        </div>
      `;
    }
  </script>
</body>
</html>
